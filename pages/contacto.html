<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good News</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./historia.html">Historia</a></li>
                <li><a href="./testimonios.html">Testimonios</a></li>
                <li><a href="./musicas.html">Musica</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Contactanos</h1>
        <section>

            <form action="" class="formulario">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Nombre completo">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Email">
                <label for="asunto" >Asunto</label>
                <select name="asunto" id="" class="asunto">
                    <option value="1">Account Help</option>
                    <option value="2">Oder Status</option>
                    <option value="3">Product Question</option>
                    <option value="4">Report an Issue with an Order</option>
                    <option value="5">Return or Exchange</option>
                    <option value="6">Payment, Discount, or Gift Card</option>
                    <option value="7">Donate</option>
                    <option value="8">Feedback</option>
                    <option value="9">Edit or Cancel an Order</option>
                    <option value="10">Report an Issue in the Store</option>
                    <option value="11">Other</option>
                </select>
                
                <label for="mensaje" placeholder=>Mensaje:</label>
                <textarea name="mensaje" id="mensaje" cols="30"  required placeholder="motivo de oracion"></textarea>
                <input type="file" name="adjuntar-archivo" id="file">
                <button type="submit">Enviar</button>
            </form>

        </section>
    </main>

    <footer>
        <p>Good News - 2025</p>
        <p>Copyright todos los derechos reservados</p>
        <p>
            <a href="https://www.facebook.com/">Facebook</a>
            <a href="https://www.instagram.com/">Instagram</a>
            <a href="https://www.twitter.com/">Twitter</a>
        </p>
    </footer>
</body>
</html>
