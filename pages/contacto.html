<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- logo de pestaña -->
    <link rel="icon" href="../assets/img/logo(1).jpeg">

    <!-- fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/style.css">

    <title>Good News</title>
</head>

<body>
    <header>
        <!-- LOGO -->
        <a class="navbar-brand fw-bold px-3" href="../index.html"><img src="../assets/img/logo(1).jpeg" class="logo-img"
                alt="">
        </a>
        <nav class="navbar navbar-expand-lg bg-light shadow-sm rounded-pill p-10">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                    <ul class="navbar-nav gap-3">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="../index.html">
                                <i class="bi bi-house-door"></i> Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./historia.html">
                                <i class="bi bi-book"></i> Historia
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./testimonios.html">
                                <i class="bi bi-people"></i> Testimonios
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./musicas.html">
                                <i class="bi bi-music-note"></i> Música
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./contacto.html">
                                <i class="bi bi-envelope"></i> Contacto
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <h1 class="h1-index">Contactanos</h1>
        <section>
            <div class="contacto-conteiner">

                <form action="" class="formulario">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Nombre completo">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Email">
                    <label for="asunto">Asunto</label>
                    <select name="asunto" id="" class="asunto">
                        <option value="1">Account Help</option>
                        <option value="2">Oder Status</option>
                        <option value="3">Product Question</option>
                        <option value="4">Report an Issue with an Order</option>
                        <option value="5">Return or Exchange</option>
                        <option value="6">Payment, Discount, or Gift Card</option>
                        <option value="7">Donate</option>
                        <option value="8">Feedback</option>
                        <option value="9">Edit or Cancel an Order</option>
                        <option value="10">Report an Issue in the Store</option>
                        <option value="11">Other</option>
                    </select>

                    <label for="mensaje" placeholder=>Mensaje:</label>
                    <textarea name="mensaje" id="mensaje" cols="30" required placeholder="motivo de oracion"></textarea>
                    <input type="file" name="adjuntar-archivo" id="file">
                    <button type="submit" class="confirm-button">Enviar</button>
                    <button class="cancel-button">Cancelar</button>
                </form>

            </div>
        </section>
    </main>

    <footer>
        <p>Good News - 2025</p>
        <p>Copyright todos los derechos reservados</p>
        <p>
            <a href="https://www.facebook.com/">Facebook</a>
            <a href="https://www.instagram.com/">Instagram</a>
            <a href="https://www.twitter.com/">Twitter</a>
        </p>
    </footer>
</body>

</html>
